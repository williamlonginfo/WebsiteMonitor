name: Website Monitor

on:
  schedule:
    # 每天每 6 小时执行一次 (UTC 时间，需注意时区转换)
    # 格式: 分 时 日 月 周
    - cron: '0 */6 * * *'
  workflow_dispatch: # 允许手动触发，方便调试测试

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10' # 使用 Python 3.10

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Run Monitor Script
      env:
        # 从 GitHub Secrets 中读取配置
        SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
        SMTP_PORT: ${{ secrets.SMTP_PORT }}
        SMTP_USER: ${{ secrets.SMTP_USER }}
        SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
        
        # 从 GitHub Variables 中读取配置 (URL 列表和模式切换更适合作为 Variables)
        # 如果未设置 Variables，可以在这里设置默认值作为 fallback，但在实际使用中建议配置 Variables
        URL_LIST: ${{ vars.URL_LIST || '[]' }}
        TEST_MODE: ${{ vars.TEST_MODE || 'false' }}
      run: |
        python monitor.py
